<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Monsterheart Management Screen</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3ead9;
      --muted: #a89d8e;
      --deep: #0f0e0d;
      --panel: #181614;
      --panel-2: #211e1a;
      --line: #3c352d;
      --ember: #e8793b;
      --ember-soft: #4a2a1c;
      --gold: #d9b56d;
      --good: #70ad86;
      --warn: #e5b454;
      --danger: #d66c62;
      --blue: #7fa5bd;
      --radius: 12px;
      --shadow: 0 18px 50px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 80% -10%, rgba(165, 72, 36, .13), transparent 32rem),
        linear-gradient(135deg, #12100f, #0b0a09 70%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .prototype-shell { min-height: 100vh; padding: 18px 18px 92px; }
    .prototype-note {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(24, 22, 20, .92);
      box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
    .sigil {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid #68402b;
      border-radius: 50%;
      color: var(--ember);
      background: #1a110d;
      font-size: 18px;
    }
    .brand h1 { margin: 1px 0 0; font-family: Georgia, serif; font-size: 20px; font-weight: 600; }
    .brand small, .subtle { color: var(--muted); }
    .phase-line { display: flex; align-items: center; gap: 7px; }
    .phase-line span { color: #716960; font-size: 12px; }
    .phase-line .current { color: var(--ink); font-weight: 750; }
    .phase-line .current::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--ember); }
    .header-resources { display: flex; gap: 8px; }
    .resource-chip, .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #131210;
      white-space: nowrap;
    }
    .resource-chip strong, .status-chip strong { color: var(--ink); }
    .status-chip.warn { color: var(--warn); border-color: #66502d; background: #231d13; }
    .status-chip.good { color: var(--good); border-color: #34513d; background: #142019; }

    .screen-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 18px 2px 12px;
    }
    .screen-intro h2 { margin: 3px 0 0; font-family: Georgia, serif; font-size: 27px; font-weight: 500; }
    .goal-mini { display: flex; align-items: center; gap: 10px; min-width: 300px; }
    .heart-icon { color: #b15c4a; font-size: 21px; line-height: 1; }
    .progress { flex: 1; height: 7px; overflow: hidden; border-radius: 99px; background: #332d27; }
    .progress > span { display: block; width: 33.333%; height: 100%; background: var(--ember); }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(24, 22, 20, .94);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h3, .section-title { margin: 0; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
    .panel-body { padding: 12px; }
    .stack { display: grid; gap: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .divider { height: 1px; background: var(--line); }
    .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .metric {
      padding: 10px;
      border: 1px solid #332e29;
      border-radius: 9px;
      background: #141210;
    }
    .metric span { display: block; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; margin-top: 4px; font-size: 18px; }
    .pool-list { display: grid; gap: 7px; }
    .pool-row { display: grid; grid-template-columns: 1fr 38px 38px; gap: 6px; align-items: center; padding: 7px 0; border-bottom: 1px solid #2b2723; }
    .pool-row:last-child { border-bottom: 0; }
    .pool-row small { color: var(--muted); text-align: right; }
    .pool-row .warning { color: var(--warn); }
    .warning-box { padding: 10px 11px; border: 1px solid #654d28; border-radius: 9px; color: #e8ca8c; background: #241c11; }

    .action-button, .quiet-button, .danger-button {
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid #825036;
      border-radius: 8px;
      color: #fff4e8;
      background: #713a23;
      cursor: pointer;
    }
    .action-button:hover { background: #82462b; }
    .quiet-button { border-color: var(--line); color: var(--ink); background: #26221e; }
    .quiet-button:hover { background: #302a25; }
    .danger-button { border-color: #6a3833; color: #e8aaa4; background: #2a1715; }
    button[disabled], .disabled-action {
      border-color: #312d29 !important;
      color: #756d64 !important;
      background: #171513 !important;
      cursor: not-allowed !important;
    }
    .button-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .reason { display: block; margin-top: 4px; color: #8d8379; font-size: 11px; }

    .manifest-card {
      padding: 11px;
      border: 1px solid #39332d;
      border-radius: 10px;
      background: #151310;
    }
    .manifest-card.selected { border-color: #915334; background: #1c1511; }
    .manifest-card h4 { margin: 0; font-size: 14px; }
    .manifest-meta { margin: 5px 0 9px; color: var(--muted); font-size: 12px; }
    .manifest-state { color: var(--good); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .manifest-state.warn { color: var(--warn); }
    .manifest-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .manifest-actions button { min-height: 28px; padding: 5px 8px; font-size: 12px; }

    .creator-action {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid #3a342e;
      border-radius: 9px;
      background: #151310;
    }
    .creator-action strong { font-size: 13px; }
    .creator-action p { grid-column: 1; margin: 0; color: var(--muted); font-size: 11px; }
    .creator-action button { grid-column: 2; grid-row: 1 / span 2; }

    .plan-card { border: 1px solid #68442f; border-radius: 10px; background: #20150f; }
    .plan-item { padding: 10px; border-bottom: 1px solid #4c3224; }
    .plan-item:last-child { border-bottom: 0; }
    .plan-item small { color: #bfa58f; }
    .cta {
      display: block;
      width: 100%;
      min-height: 42px;
      border: 1px solid #b0683f;
      border-radius: 9px;
      color: #fff8ed;
      background: linear-gradient(#9a522e, #773b22);
      font-weight: 800;
      cursor: pointer;
    }
    .flow-note { color: var(--muted); font-size: 12px; line-height: 1.45; }

    /* Variant A — stable three-column ledger. */
    .variant-a { display: grid; grid-template-columns: minmax(210px, 260px) minmax(420px, 1fr) minmax(270px, 330px); gap: 12px; }
    .manifest-grid { display: grid; grid-template-columns: repeat(2, minmax(190px, 1fr)); gap: 9px; }

    /* Variant B — plan and consequences first. */
    .variant-b { display: grid; gap: 12px; }
    .cycle-board { display: grid; grid-template-columns: minmax(220px, .85fr) minmax(340px, 1.35fr) minmax(230px, .9fr); gap: 12px; }
    .phase-ribbon { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
    .phase-step { padding: 11px; border-right: 1px solid var(--line); color: var(--muted); }
    .phase-step:last-child { border-right: 0; }
    .phase-step.current { color: var(--ink); background: #26170f; }
    .phase-step strong { display: block; margin-bottom: 3px; }
    .queue-lane { display: grid; gap: 8px; }
    .queue-slot { min-height: 58px; padding: 10px; border: 1px dashed #56473c; border-radius: 9px; background: #151310; }
    .queue-slot.filled { border-style: solid; border-color: #7b4b31; background: #20150f; }
    .preview-line { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid #2c2824; }
    .preview-line:last-child { border-bottom: 0; }
    .preview-number { color: var(--gold); font-weight: 800; }
    .roster-strip { display: grid; grid-template-columns: 1.2fr 2.2fr 1fr; gap: 12px; }
    .dense-table { width: 100%; border-collapse: collapse; }
    .dense-table th, .dense-table td { padding: 8px; border-bottom: 1px solid #302b26; text-align: left; }
    .dense-table th { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; }

    /* Variant C — list + detail inspector. */
    .variant-c { display: grid; grid-template-columns: minmax(310px, 390px) 1fr; gap: 12px; min-height: 590px; }
    .workspace-nav { display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
    .tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
    .tab { padding: 7px 9px; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; }
    .tab.active { border-color: #68432f; color: var(--ink); background: #25170f; }
    .object-list { display: grid; align-content: start; gap: 2px; padding: 7px; }
    .object-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 8px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .object-row:hover, .object-row.active { border-color: #64412e; background: #21160f; }
    .object-row small { color: var(--muted); }
    .object-row .tag { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .inspector { display: grid; grid-template-rows: auto 1fr auto; }
    .inspector-main { display: grid; grid-template-columns: minmax(330px, 1.4fr) minmax(220px, .8fr); gap: 12px; padding: 14px; }
    .detail-hero { padding: 16px; border: 1px solid #4b3a2f; border-radius: 11px; background: linear-gradient(145deg, #26170f, #171310); }
    .detail-hero h3 { margin: 4px 0 8px; font-family: Georgia, serif; font-size: 25px; }
    .detail-stat { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #3a2d25; }
    .detail-stat:last-child { border-bottom: 0; }
    .action-dock { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 14px; border-top: 1px solid var(--line); background: #141210; }
    .action-dock .plan-summary { flex: 1; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tag.available { color: var(--good); border-color: #34513d; }
    .tag.warning { color: var(--warn); border-color: #66502d; }
    .tag.queued { color: var(--gold); border-color: #71492f; }
    .prototype-feedback {
      position: fixed;
      right: 18px;
      bottom: 78px;
      z-index: 20;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid #87573a;
      border-radius: 9px;
      color: #f3ddca;
      background: #25170f;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .16s ease;
    }
    .prototype-feedback.show { opacity: 1; transform: none; }

    .prototype-switcher {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid #77695b;
      border-radius: 999px;
      background: #f0e5d4;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .5);
      transform: translateX(-50%);
      color: #1c1713;
    }
    .prototype-switcher button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      color: #1c1713;
      background: #d4c5af;
      cursor: pointer;
      font-size: 18px;
    }
    .prototype-switcher strong { min-width: 210px; text-align: center; font-size: 12px; }

    @media (max-width: 1040px) {
      .phase-line { display: none; }
      .variant-a { grid-template-columns: 220px 1fr; }
      .variant-a > :last-child { grid-column: 1 / -1; }
      .cycle-board, .roster-strip { grid-template-columns: 1fr 1fr; }
      .cycle-board > :last-child, .roster-strip > :last-child { grid-column: 1 / -1; }
      .variant-c { grid-template-columns: 300px 1fr; }
      .inspector-main { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .prototype-shell { padding: 10px 10px 92px; }
      .topbar, .screen-intro { align-items: flex-start; flex-direction: column; }
      .header-resources { width: 100%; flex-wrap: wrap; overflow: visible; }
      .goal-mini { width: 100%; min-width: 0; }
      .variant-a, .cycle-board, .roster-strip, .variant-c { grid-template-columns: 1fr; }
      .variant-a > :last-child, .cycle-board > :last-child, .roster-strip > :last-child { grid-column: auto; }
      .manifest-grid { grid-template-columns: 1fr; }
      .phase-ribbon { grid-template-columns: repeat(2, 1fr); }
      .workspace-nav { max-height: 420px; }
      .inspector-main { padding: 10px; }
      .action-dock { align-items: stretch; flex-direction: column; }
      .prototype-switcher { bottom: 10px; width: calc(100% - 20px); justify-content: space-between; }
      .prototype-switcher strong { min-width: 0; }
    }
  </style>
</head>
<body data-prototype="true">
  <!-- Three variants of the first-slice management screen, switchable via ?variant=A|B|C on this standalone prototype route. -->
  <div id="app"></div>
  <div id="feedback" class="prototype-feedback" role="status"></div>
  <div class="prototype-switcher" aria-label="Prototype variants">
    <button id="previous-variant" aria-label="Previous variant">←</button>
    <strong id="variant-label"></strong>
    <button id="next-variant" aria-label="Next variant">→</button>
  </div>

  <script>
    const variants = [
      { key: "A", name: "Realm ledger" },
      { key: "B", name: "Cycle command desk" },
      { key: "C", name: "Inspector workspace" }
    ];

    const snapshot = {
      cycle: 18,
      resources: { essence: 1, shards: 2, embers: 7 },
      population: { total: 6, capacity: 8, sustainedAllocated: 3, sustainedUnallocated: 2, unfedUnallocated: 1, fading: 0 },
      project: { name: "Emberheart", progress: 1, target: 3, essence: 3 },
      plan: { manifestation: "None", growth: "Kindle Emberkin", removals: "None" }
    };

    const manifestations = [
      { id: 1, name: "Emberwell #1", type: "Resource Source", state: "Fully staffed", meta: "1/1 Emberkin · Harvest: +4 Living Embers, +1 Shard", actions: ["Withdraw Emberkin", "Demanifest"] },
      { id: 2, name: "Emberwell #2", type: "Resource Source", state: "Understaffed", meta: "0/1 Emberkin · Produces nothing until staffed", actions: ["Commit Emberkin", "Demanifest"], warning: true },
      { id: 3, name: "Crucible of Becoming", type: "Transfiguration", state: "Supporting Emberheart", meta: "2/2 Emberkin · Growth: +1 progress", actions: ["Withdraw Emberkin", "Abandon Transfiguration", "Demanifest"] },
      { id: 4, name: "Cinder Nest #1", type: "Habitat", state: "Available", meta: "+4 Emberkin Habitat capacity", actions: ["Demanifest"] },
      { id: 5, name: "Cinder Nest #2", type: "Habitat", state: "Available", meta: "+4 Emberkin Habitat capacity", actions: ["Demanifest"] },
      { id: 6, name: "Ember Cradle", type: "Kindling Site", state: "Reserved this Cycle", meta: "1/1 Kindle Emberkin slot queued", actions: ["Demanifest"] }
    ];

    function header() {
      return `
        <div class="prototype-note">Throwaway UI prototype · aggregate Emberkin pools, no individual units</div>
        <header class="topbar">
          <div class="brand"><div class="sigil">◆</div><div><small>Ashen Reach</small><h1>Monsterheart</h1></div></div>
          <div class="phase-line"><span class="current">Stillness</span><span>›</span><span>Surge</span><span>›</span><span>Growth</span><span>›</span><span>Harvest</span></div>
          <div class="header-resources">
            <span class="resource-chip">Essence <strong>${snapshot.resources.essence}</strong></span>
            <span class="resource-chip">Shards <strong>${snapshot.resources.shards}/4</strong></span>
            <span class="resource-chip">Living Embers <strong>${snapshot.resources.embers}</strong></span>
            <span class="status-chip warn">Unfed <strong>1</strong></span>
          </div>
        </header>
        <div class="screen-intro">
          <div><span class="subtle">Realm Cycle ${snapshot.cycle} · Stillness</span><h2>Prepare the Realm</h2></div>
          <div class="goal-mini"><span class="heart-icon">♥</span><div><strong>Emberheart ${snapshot.project.progress}/${snapshot.project.target}</strong><div class="subtle">3 Essence committed</div></div><div class="progress"><span></span></div></div>
        </div>`;
    }

    function poolsPanel() {
      return `<section class="panel">
        <div class="panel-head"><h3>Emberkin pools</h3><span class="tag warning">1 Unfed</span></div>
        <div class="panel-body stack">
          <div class="metric-grid"><div class="metric"><span>Population</span><strong>6 / 8</strong></div><div class="metric"><span>Committed</span><strong>3</strong></div></div>
          <div class="pool-list">
            <div class="pool-row"><strong>Sustained</strong><small>3 Alloc.</small><small>2 Free</small></div>
            <div class="pool-row"><strong class="warning">Unfed</strong><small>0 Alloc.</small><small class="warning">1 Free</small></div>
            <div class="pool-row"><strong>Fading</strong><small>—</small><small>0</small></div>
          </div>
          <div class="warning-box"><strong>Recoverable pressure</strong><br>One Emberkin needs Living Embers this Harvest. Feeding prioritises it automatically.</div>
        </div>
      </section>`;
    }

    function resourcesPanel() {
      return `<section class="panel">
        <div class="panel-head"><h3>Realm supply</h3></div>
        <div class="panel-body stack">
          <div class="row"><span>Flame Essence</span><strong>1 available · 3 committed</strong></div>
          <div class="row"><span>Essence Shards</span><strong>2 / 4</strong></div>
          <div class="row"><span>Living Embers</span><strong>7</strong></div>
          <div class="divider"></div>
          <div class="flow-note">Projected Harvest: +4 Living Embers, +1 Shard, −6 Sustenance.</div>
        </div>
      </section>`;
    }

    function manifestCard(item, selected = false) {
      return `<article class="manifest-card ${selected ? "selected" : ""}">
        <div class="row"><h4>${item.name}</h4><span class="manifest-state ${item.warning ? "warn" : ""}">${item.state}</span></div>
        <div class="manifest-meta">${item.type}<br>${item.meta}</div>
        <div class="manifest-actions">${item.actions.map(action => `<button class="${action.includes("Abandon") ? "danger-button" : "quiet-button"}" data-demo-action="${action} · ${item.name}">${action}</button>`).join("")}</div>
      </article>`;
    }

    function creatorActions(compact = false) {
      const actions = [
        ["Kindle Emberkin", "Queued · 1 Living Ember · 1/1 Cradle slot", true, false],
        ["Manifest Cinder Nest", "Available · 1 Flame Essence", false, false],
        ["Manifest Emberwell", "Available · 1 Flame Essence", false, false],
        ["Manifest Ember Cradle", "Available · 1 Flame Essence", false, false],
        ["Manifest Crucible", "Unavailable · Manifestation slot already used", false, true],
        ["Shape Emberheart", "Unavailable · Transfiguration already active", false, true]
      ];
      return `<div class="stack">${actions.map(([name, note, queued, disabled]) => compact
        ? `<button class="object-row ${queued ? "active" : ""}" ${disabled ? "disabled" : ""} data-demo-action="${name}"><strong>${name}</strong><small>${note}</small><span class="tag ${disabled ? "" : queued ? "queued" : "available"}">${disabled ? "Unavailable" : queued ? "Queued" : "Available"}</span></button>`
        : `<div class="creator-action"><strong>${name}</strong><p>${note}</p><button class="${queued ? "quiet-button" : "action-button"}" ${disabled ? "disabled" : ""} data-demo-action="${name}">${queued ? "Review" : "Queue"}</button></div>`
      ).join("")}</div>`;
    }

    function planPanel() {
      return `<section class="panel">
        <div class="panel-head"><h3>Cycle plan</h3><span class="tag queued">1 Action</span></div>
        <div class="panel-body stack">
          <div class="plan-card">
            <div class="plan-item"><small>Manifestation slot</small><div>None queued</div></div>
            <div class="plan-item"><small>Growth</small><div class="row"><strong class="js-plan-slot">Kindle Emberkin</strong><button class="quiet-button" data-demo-action="Remove Kindle Emberkin">Remove</button></div></div>
            <div class="plan-item"><small>Demanifest Actions</small><div>None queued</div></div>
          </div>
          <div class="flow-note">Locking the plan spends its reserved resources. The Emberkin appears during Growth and can work next Cycle.</div>
          <button class="cta" data-demo-action="Manifest Intent">Manifest Intent · Begin Cycle</button>
        </div>
      </section>`;
    }

    function variantA() {
      return `${header()}<main class="variant-a">
        <div class="stack">${poolsPanel()}${resourcesPanel()}</div>
        <section class="panel"><div class="panel-head"><h3>Existing Manifestations</h3><span class="subtle">Actions belong to each concrete Manifestation</span></div><div class="panel-body"><div class="manifest-grid">${manifestations.map(item => manifestCard(item)).join("")}</div></div></section>
        <div class="stack"><section class="panel"><div class="panel-head"><h3>Creator Actions</h3><span class="subtle">Available and unavailable</span></div><div class="panel-body">${creatorActions()}</div></section>${planPanel()}</div>
      </main>`;
    }

    function variantB() {
      return `${header()}<main class="variant-b">
        <section class="panel">
          <div class="phase-ribbon"><div class="phase-step current"><strong>1 · Stillness</strong>Plan and commit</div><div class="phase-step"><strong>2 · Surge</strong>Manifest</div><div class="phase-step"><strong>3 · Growth</strong>Kindle + progress</div><div class="phase-step"><strong>4 · Harvest</strong>Produce + sustain</div></div>
          <div class="panel-body cycle-board">
            <div><h3 class="section-title">Choose Actions</h3><p class="flow-note">Creator Actions enter the plan. Local Actions remain on each Manifestation below.</p>${creatorActions(true)}</div>
            <div><div class="row"><h3 class="section-title">This Cycle</h3><span class="tag queued">Editable</span></div><div class="queue-lane" style="margin-top:10px"><div class="queue-slot"><small>Manifestation</small><div class="subtle">Empty · one slot available</div></div><div class="queue-slot filled"><small>Growth</small><div class="row"><strong class="js-plan-slot">Kindle Emberkin</strong><button class="quiet-button" data-demo-action="Remove Kindle Emberkin">Remove</button></div></div><div class="queue-slot"><small>Demanifestations</small><div class="subtle">None · unlimited</div></div></div><button class="cta" style="margin-top:10px" data-demo-action="Manifest Intent">Manifest Intent · Lock Cycle Plan</button></div>
            <div><div class="row"><h3 class="section-title">Expected outcome</h3><span class="status-chip warn">1 warning</span></div><div style="margin-top:9px"><div class="preview-line"><span class="preview-number">+1</span><span>Emberkin during Growth</span></div><div class="preview-line"><span class="preview-number">+1</span><span>Emberheart progress</span></div><div class="preview-line"><span class="preview-number">−2</span><span>Living Embers after production and Sustenance</span></div><div class="preview-line"><span class="preview-number">✓</span><span>Unfed Emberkin should recover</span></div></div></div>
          </div>
        </section>
        <div class="roster-strip">
          ${poolsPanel()}
          <section class="panel"><div class="panel-head"><h3>Manifestation operations</h3><span class="subtle">Operate and restructure here</span></div><div class="panel-body"><table class="dense-table"><thead><tr><th>Manifestation</th><th>Labour</th><th>Effect</th><th>Local Actions</th></tr></thead><tbody>${manifestations.map(item => `<tr><td><strong>${item.name}</strong><br><small class="subtle">${item.state}</small></td><td>${item.meta.split(" · ")[0]}</td><td>${item.meta.split(" · ")[1] || item.type}</td><td><button class="quiet-button" data-demo-action="Inspect ${item.name}">Inspect</button></td></tr>`).join("")}</tbody></table></div></section>
          ${resourcesPanel()}
        </div>
      </main>`;
    }

    function variantC() {
      const selected = manifestations[1];
      return `${header()}<main class="variant-c">
        <section class="panel workspace-nav">
          <div class="panel-head"><h3>Realm index</h3><span class="status-chip warn">2 need attention</span></div>
          <div class="tabs"><button class="tab">Actions</button><button class="tab active">Manifestations</button><button class="tab">Emberkin</button><button class="tab">Supply</button></div>
          <div class="object-list">${manifestations.map(item => `<button class="object-row ${item.id === selected.id ? "active" : ""}" data-demo-action="Inspect ${item.name}"><strong>${item.name}</strong><small>${item.type} · ${item.meta}</small><span class="tag ${item.warning ? "warning" : "available"}">${item.state}</span></button>`).join("")}</div>
        </section>
        <section class="panel inspector">
          <div class="panel-head"><div><span class="subtle">Manifestation details</span><h3 style="margin-top:3px">${selected.name}</h3></div><span class="tag warning">${selected.state}</span></div>
          <div class="inspector-main">
            <div class="stack">
              <div class="detail-hero"><span class="prototype-note">Resource Source</span><h3>Emberwell</h3><p class="flow-note">Turns Emberkin labour into Living Embers and Flame Essence Shards during Harvest.</p><div class="detail-stat"><span>Labour requirement</span><strong>0 / 1 Emberkin</strong></div><div class="detail-stat"><span>Current Harvest</span><strong>Produces nothing</strong></div><div class="detail-stat"><span>When staffed</span><strong>+4 Living Embers · +1 Shard</strong></div></div>
              <section><h3 class="section-title">Actions on this Manifestation</h3><p class="flow-note">These Actions belong here—not in the global Creator Action list.</p><div class="button-row"><button class="action-button" data-demo-action="Commit Emberkin · Emberwell #2">Commit Emberkin</button><button class="quiet-button" disabled>Withdraw Emberkin</button><button class="danger-button" data-demo-action="Demanifest · Emberwell #2">Demanifest</button></div></section>
            </div>
            <div class="stack">${poolsPanel()}${resourcesPanel()}<section class="panel"><div class="panel-head"><h3>Emberheart</h3><span class="heart-icon">♥</span></div><div class="panel-body"><div class="row"><strong>Progress</strong><strong>1 / 3</strong></div><div class="progress" style="margin:8px 0"><span></span></div><div class="flow-note">Crucible fully staffed · +1 next Growth</div></div></section></div>
          </div>
          <div class="action-dock"><div class="plan-summary"><span class="subtle">Cycle plan</span><div><strong class="js-plan-slot">Kindle Emberkin</strong> · no Manifestation · no Demanifestation</div></div><button class="quiet-button" data-demo-action="Review Cycle plan">Review plan</button><button class="cta" style="width:auto;padding:0 18px" data-demo-action="Manifest Intent">Manifest Intent</button></div>
        </section>
      </main>`;
    }

    function currentVariant() {
      const requested = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return variants.find(item => item.key === requested) || variants[0];
    }

    function render() {
      const active = currentVariant();
      document.querySelector("#app").innerHTML = `<div class="prototype-shell">${active.key === "A" ? variantA() : active.key === "B" ? variantB() : variantC()}</div>`;
      document.querySelector("#variant-label").textContent = `${active.key} — ${active.name}`;
      document.querySelectorAll("[data-demo-action]").forEach(button => button.addEventListener("click", () => showFeedback(button.dataset.demoAction)));
    }

    function showFeedback(action) {
      const feedback = document.querySelector("#feedback");
      feedback.textContent = action === "Manifest Intent"
        ? "Prototype flow: validate requirements, lock the Cycle plan, then move to Surge."
        : `Prototype flow: ${action}. The final game would update the visible plan or selected Manifestation.`;
      feedback.classList.add("show");
      clearTimeout(showFeedback.timeout);
      showFeedback.timeout = setTimeout(() => feedback.classList.remove("show"), 2600);
    }

    function cycleVariant(direction) {
      const active = currentVariant();
      const index = variants.findIndex(item => item.key === active.key);
      const next = variants[(index + direction + variants.length) % variants.length];
      const url = new URL(location.href);
      url.searchParams.set("variant", next.key);
      history.replaceState({}, "", url);
      render();
    }

    document.querySelector("#previous-variant").addEventListener("click", () => cycleVariant(-1));
    document.querySelector("#next-variant").addEventListener("click", () => cycleVariant(1));
    addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });
    addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
